[workspace]
members = ["crates/runtime", "crates/catalog", "apps/gallery", "xtask"]
exclude = ["fixtures/consumer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
repository = "https://github.com/Jagalite/spark"

[workspace.dependencies]
ratatui-core = { version = "=0.1.2", default-features = false, features = ["std", "underline-color"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["std", "crossterm"] }
spark-runtime = { path = "crates/runtime" }
spark-catalog = { path = "crates/catalog" }
unicode-width = "=0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
